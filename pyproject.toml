[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musetalk"
version = "0.1.0"
description = "MuseTalk: Real-Time High Quality Lip Sync with Latent Space Inpainting"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision",
    "diffusers>=0.24.0",
    "transformers>=4.30.0",
    "omegaconf>=2.2",
    "numpy<2",
    "opencv-python>=4.8",
    "einops",
    "tqdm",
    "librosa",
    "Pillow",
]

[project.scripts]
generate-musetalk = "generate_musetalk:main"

[tool.setuptools]
py-modules = ["generate_musetalk"]

[tool.setuptools.packages.find]
where = ["."]
include = ["musetalk*"]
